spring:
  application:
    name: support-agent
  profiles:
    default: dev
  datasource:
    url: ${SUPPORT_AGENT_MYSQL_URL:jdbc:mysql://localhost:3306/support_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${SUPPORT_AGENT_MYSQL_USERNAME:support_agent}
    password: ${SUPPORT_AGENT_MYSQL_PASSWORD:}
  data:
    redis:
      url: ${SUPPORT_AGENT_REDIS_URL:redis://localhost:6379}
      password: ${SUPPORT_AGENT_REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

support-agent:
  operator-id: dev-operator
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_HTTP_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    chat-model: ${SUPPORT_AGENT_CHAT_MODEL:qwen-plus}
    embedding-model: ${SUPPORT_AGENT_EMBEDDING_MODEL:text-embedding-v4}
    rerank-model: ${SUPPORT_AGENT_RERANK_MODEL:gte-rerank-v2}
  elasticsearch:
    url: ${SUPPORT_AGENT_ELASTICSEARCH_URL:http://localhost:9200}
    username: ${SUPPORT_AGENT_ELASTICSEARCH_USERNAME:}
    password: ${SUPPORT_AGENT_ELASTICSEARCH_PASSWORD:}
    knowledge-index: ${SUPPORT_AGENT_KNOWLEDGE_INDEX:support_knowledge_v1}
    knowledge-alias: ${SUPPORT_AGENT_KNOWLEDGE_ALIAS:support_knowledge_current}
  retrieval:
    vector-minimum-similarity: ${SUPPORT_AGENT_VECTOR_MINIMUM_SIMILARITY:0.20}
    vector-candidates: ${SUPPORT_AGENT_VECTOR_CANDIDATES:200}
    rerank-grounded-threshold: ${SUPPORT_AGENT_RERANK_GROUNDED_THRESHOLD:0.35}
  async-task:
    enabled: true
    worker-id: ${SUPPORT_AGENT_WORKER_ID:}
    poll-delay: 2s
    batch-size: 10
    concurrency: 2
    lease-duration: 5m

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,elasticsearch,dashScopeConfiguration

info:
  application:
    name: ${spring.application.name}
    description: 企业内部技术支持 Agent

logging:
  structured:
    format:
      console: logstash
