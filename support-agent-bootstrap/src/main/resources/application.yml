spring:
  application:
    name: support-agent
  profiles:
    default: dev
  datasource:
    # MySQL 驱动连接和读取超时，单位毫秒；避免网络半开时无限占用请求线程。
    url: ${SUPPORT_AGENT_MYSQL_URL:jdbc:mysql://localhost:3306/support_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectTimeout=5000&socketTimeout=30000}
    username: ${SUPPORT_AGENT_MYSQL_USERNAME:support_agent}
    password: ${SUPPORT_AGENT_MYSQL_PASSWORD:}
    hikari:
      # 从连接池取得连接的最大等待时间，Hikari 原生单位为毫秒。
      connection-timeout: ${SUPPORT_AGENT_MYSQL_POOL_TIMEOUT:5000}
      # 检查数据库连接有效性的最大等待时间，Hikari 原生单位为毫秒。
      validation-timeout: ${SUPPORT_AGENT_MYSQL_VALIDATION_TIMEOUT:3000}
  data:
    redis:
      url: ${SUPPORT_AGENT_REDIS_URL:redis://localhost:6379}
      password: ${SUPPORT_AGENT_REDIS_PASSWORD:}
      # 建立 Redis TCP 连接的最大等待时间。
      connect-timeout: ${SUPPORT_AGENT_REDIS_CONNECT_TIMEOUT:2s}
      # 单条 Redis 命令等待响应的最大时间。
      timeout: ${SUPPORT_AGENT_REDIS_COMMAND_TIMEOUT:3s}
      lettuce:
        # 应用关闭时等待 Lettuce 资源结束的时间。
        shutdown-timeout: ${SUPPORT_AGENT_REDIS_SHUTDOWN_TIMEOUT:2s}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

support-agent:
  auth:
    token-ttl: ${SUPPORT_AGENT_AUTH_TOKEN_TTL:2h}
    bootstrap-admin:
      enabled: ${SUPPORT_AGENT_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${SUPPORT_AGENT_BOOTSTRAP_ADMIN_USERNAME:}
      display-name: ${SUPPORT_AGENT_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
      password: ${SUPPORT_AGENT_BOOTSTRAP_ADMIN_PASSWORD:}
  operator-id: dev-operator
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_HTTP_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    chat-model: ${SUPPORT_AGENT_CHAT_MODEL:qwen3.8-flash}
    intent-model: ${SUPPORT_AGENT_INTENT_MODEL:qwen3.7-flash}
    # 单会话滚动摘要模型，与普通 Chat 和意图模型端口隔离。
    summary-model: ${SUPPORT_AGENT_SUMMARY_MODEL:qwen3.7-flash}
    # 跨会话长期记忆候选模型，与普通 Chat 和会话摘要端口隔离。
    memory-model: ${SUPPORT_AGENT_MEMORY_MODEL:qwen3.7-flash}
    embedding-model: ${SUPPORT_AGENT_EMBEDDING_MODEL:text-embedding-v4}
    rerank-model: ${SUPPORT_AGENT_RERANK_MODEL:qwen3-rerank}
    # 普通 Chat 完整生成超时；首片段与完整请求延迟仍由阶段 8 门禁独立判断。
    chat-timeout: ${SUPPORT_AGENT_CHAT_TIMEOUT:120s}
    # 意图识别总超时，失败时由应用层降级为 SUPPORT_QUERY。
    intent-timeout: ${SUPPORT_AGENT_INTENT_TIMEOUT:3s}
    # 单次结构化会话摘要完整生成超时。
    summary-timeout: ${SUPPORT_AGENT_SUMMARY_TIMEOUT:30s}
    # 单次长期记忆候选结构化生成超时；失败不影响已经完成的聊天。
    memory-timeout: ${SUPPORT_AGENT_MEMORY_TIMEOUT:15s}
    # 工单草稿结构化生成单次超时。
    ticket-timeout: ${SUPPORT_AGENT_TICKET_TIMEOUT:30s}
    # 已解决案例结构化生成单次超时。
    resolved-case-timeout: ${SUPPORT_AGENT_RESOLVED_CASE_TIMEOUT:60s}
    # 单批 Embedding 调用总超时，超时后取消等待并按安全重试策略处理。
    embedding-timeout: ${SUPPORT_AGENT_EMBEDDING_TIMEOUT:10s}
    # 单次 Rerank 网络读取超时。
    rerank-timeout: ${SUPPORT_AGENT_RERANK_TIMEOUT:10s}
    # Embedding 与 Rerank 为幂等只读调用，最多尝试三次。
    retry-max-attempts: ${SUPPORT_AGENT_MODEL_RETRY_MAX_ATTEMPTS:3}
    # 首次安全重试前的基础退避时间，实际等待会附加随机抖动。
    retry-initial-delay: ${SUPPORT_AGENT_MODEL_RETRY_INITIAL_DELAY:100ms}
    # 普通问候、知识回答和工单查询的最大输出 Token。
    chat-max-output-tokens: ${SUPPORT_AGENT_CHAT_MAX_OUTPUT_TOKENS:1200}
    # 意图结构化识别的最大输出 Token。
    intent-max-output-tokens: ${SUPPORT_AGENT_INTENT_MAX_OUTPUT_TOKENS:256}
    # 单次结构化会话摘要最大输出 Token。
    summary-max-output-tokens: ${SUPPORT_AGENT_SUMMARY_MAX_OUTPUT_TOKENS:1200}
    # 单次最多三条简短长期记忆候选的输出上限。
    memory-max-output-tokens: ${SUPPORT_AGENT_MEMORY_MAX_OUTPUT_TOKENS:400}
    # 工单草稿和案例草稿结构化生成的最大输出 Token。
    structured-max-output-tokens: ${SUPPORT_AGENT_STRUCTURED_MAX_OUTPUT_TOKENS:800}
    # 知识回答 Prompt 版本；只有压缩版通过完整 A/B 门禁后才允许设为 COMPACT。
    grounded-prompt-variant: ${SUPPORT_AGENT_GROUNDED_PROMPT_VARIANT:ORIGINAL}
  elasticsearch:
    url: ${SUPPORT_AGENT_ELASTICSEARCH_URL:http://localhost:9200}
    username: ${SUPPORT_AGENT_ELASTICSEARCH_USERNAME:}
    password: ${SUPPORT_AGENT_ELASTICSEARCH_PASSWORD:}
    knowledge-index: ${SUPPORT_AGENT_KNOWLEDGE_INDEX:support_knowledge_v1}
    knowledge-alias: ${SUPPORT_AGENT_KNOWLEDGE_ALIAS:support_knowledge_current}
    # 建立 Elasticsearch TCP 连接的最大等待时间。
    connect-timeout: ${SUPPORT_AGENT_ELASTICSEARCH_CONNECT_TIMEOUT:2s}
    # 从 Elasticsearch HTTP 连接池取得连接的最大等待时间。
    connection-request-timeout: ${SUPPORT_AGENT_ELASTICSEARCH_CONNECTION_REQUEST_TIMEOUT:2s}
    # 等待 Elasticsearch 完整响应的最大时间。
    response-timeout: ${SUPPORT_AGENT_ELASTICSEARCH_RESPONSE_TIMEOUT:10s}
  retrieval:
    # BM25 分支最多返回的候选数，允许 1～1000。
    bm25-top-k: ${SUPPORT_AGENT_BM25_TOP_K:30}
    # 向量分支最多返回的候选数，允许 1～1000。
    vector-top-k: ${SUPPORT_AGENT_VECTOR_TOP_K:30}
    # 向量候选最低余弦相似度，允许 -1～1。
    vector-minimum-similarity: ${SUPPORT_AGENT_VECTOR_MINIMUM_SIMILARITY:0.20}
    # Elasticsearch 近似向量候选池，必须不小于 vector-top-k，最多 10000。
    vector-candidates: ${SUPPORT_AGENT_VECTOR_CANDIDATES:100}
    # RRF 名次平滑常数，允许 1～10000；值越大，靠前名次差异越平缓。
    rrf-k: ${SUPPORT_AGENT_RRF_K:20}
    # RRF 融合后保留的候选数，允许 1～1000，且不能超过双分支候选总数。
    fusion-top-k: ${SUPPORT_AGENT_FUSION_TOP_K:20}
    # 送入 Rerank 的候选数，不能超过 fusion-top-k。
    rerank-top-k: ${SUPPORT_AGENT_RERANK_TOP_K:20}
    # 离线排名指标保留的原始候选数，不能超过 rerank-top-k。
    ranked-top-k: ${SUPPORT_AGENT_RANKED_TOP_K:10}
    # 最终回答证据数，允许 1～5，且不能超过 rerank-top-k。
    final-top-k: ${SUPPORT_AGENT_FINAL_TOP_K:5}
    # Rerank 成功时接受可靠知识的全局最低分，允许 0～1。
    rerank-grounded-threshold: ${SUPPORT_AGENT_RERANK_GROUNDED_THRESHOLD:0.30}
    # 文本分析方案；ICU_ONLY 为基线，ICU_WITH_CJK 增加内置 CJK 辅助字段。
    analysis-profile: ${SUPPORT_AGENT_ANALYSIS_PROFILE:ICU_ONLY}
    # BM25 来源标题权重，允许大于 0 且不超过 20。
    title-weight: ${SUPPORT_AGENT_TITLE_WEIGHT:3.0}
    # BM25 标题路径权重，允许大于 0 且不超过 20。
    heading-weight: ${SUPPORT_AGENT_HEADING_WEIGHT:2.0}
    # BM25 分块正文权重，允许大于 0 且不超过 20。
    content-weight: ${SUPPORT_AGENT_CONTENT_WEIGHT:1.0}
    # BM25 精确技术词完全匹配权重，允许大于 0 且不超过 20。
    exact-term-weight: ${SUPPORT_AGENT_EXACT_TERM_WEIGHT:5.0}
  async-task:
    enabled: true
    worker-id: ${SUPPORT_AGENT_WORKER_ID:}
    poll-delay: 2s
    batch-size: 10
    concurrency: 2
    lease-duration: 5m
    # 可重试任务每次失败后的退避序列；超过序列长度时沿用最后一项。
    retry-delays: ${SUPPORT_AGENT_ASYNC_TASK_RETRY_DELAYS:30s,2m,10m}
  conversation:
    # 会话及完成消息的空闲保留时间。
    ttl: ${SUPPORT_AGENT_CONVERSATION_TTL:7d}
    # 工单建议从生成到允许消费的有效时间。
    suggestion-ttl: ${SUPPORT_AGENT_SUGGESTION_TTL:24h}
    # 单次聊天执行权租约，必须短于会话保留时间。
    run-lease: ${SUPPORT_AGENT_CHAT_RUN_LEASE:3m}
    # 工单建议消费租约，必须短于建议有效时间。
    suggestion-lease: ${SUPPORT_AGENT_SUGGESTION_LEASE:3m}
    # 单次 Chat 输入的内部工程 Token 预算，不代表供应商最大上下文窗口。
    input-budget-tokens: ${SUPPORT_AGENT_CONVERSATION_INPUT_BUDGET_TOKENS:24000}
    # 为正式回答保留的最大输出 Token。
    output-reserve-tokens: ${SUPPORT_AGENT_CONVERSATION_OUTPUT_RESERVE_TOKENS:1200}
    # 应对确定性估算误差和协议开销的固定 Token 余量。
    safety-margin-tokens: ${SUPPORT_AGENT_CONVERSATION_SAFETY_MARGIN_TOKENS:1024}
    # 摘要之外始终保留在 Redis 的最近完整成功轮次。
    recent-full-turns: ${SUPPORT_AGENT_CONVERSATION_RECENT_FULL_TURNS:6}
    # 达到该成功轮次数后，在回答完成后异步生成滚动摘要。
    soft-trigger-turns: ${SUPPORT_AGENT_CONVERSATION_SOFT_TRIGGER_TURNS:12}
    # 会话记忆达到该估算 Token 后异步生成滚动摘要。
    soft-trigger-memory-tokens: ${SUPPORT_AGENT_CONVERSATION_SOFT_TRIGGER_MEMORY_TOKENS:6000}
    # 达到该原始轮次数时，在下一次模型调用前同步生成摘要。
    hard-trigger-turns: ${SUPPORT_AGENT_CONVERSATION_HARD_TRIGGER_TURNS:20}
  memory:
    # 已确认长期记忆每次注入模型上下文的独立估算 Token 上限。
    input-budget-tokens: ${SUPPORT_AGENT_MEMORY_INPUT_BUDGET_TOKENS:1000}
    # 未确认候选从创建时间起允许保留的最长时间。
    candidate-retention: ${SUPPORT_AGENT_MEMORY_CANDIDATE_RETENTION:30d}
    # 单实例允许同时执行的候选模型请求总数。
    candidate-global-concurrency: ${SUPPORT_AGENT_MEMORY_CANDIDATE_GLOBAL_CONCURRENCY:4}
    # 单个用户允许同时执行的候选模型请求数；首版固定为 1。
    candidate-per-user-concurrency: ${SUPPORT_AGENT_MEMORY_CANDIDATE_PER_USER_CONCURRENCY:1}
    # 后台候选清理两次触发之间的固定延迟。
    cleanup-interval: ${SUPPORT_AGENT_MEMORY_CLEANUP_INTERVAL:1h}
    # 单个清理事务最多领取并删除的候选数量。
    cleanup-batch-size: ${SUPPORT_AGENT_MEMORY_CLEANUP_BATCH_SIZE:500}
  observability:
    # Outbox 指标写入本地 Gauge 的采样周期；指标抓取本身不会访问数据库。
    outbox-sample-delay: ${SUPPORT_AGENT_OUTBOX_SAMPLE_DELAY:10s}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,elasticsearch,dashScopeConfiguration

info:
  application:
    name: ${spring.application.name}
    description: 企业内部技术支持 Agent

logging:
  structured:
    format:
      console: logstash
